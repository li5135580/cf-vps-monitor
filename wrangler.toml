name = "vps-monitor-worker"
main = "dist/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "vps-monitor-db"
database_id = "your-database-id-here"

[[observability]]
enabled = true

[vars]
USERNAME = "admin"
PASSWORD = "changeme123"

[env.production]
vars = { JWT_SECRET = "replace-with-random-secret" }
