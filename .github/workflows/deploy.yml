name: Build & Deploy

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Build worker
        run: node build.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker
          path: dist/worker.js

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: worker
          path: dist

      - name: Inject secrets and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          sed -i "s/__D1_DATABASE_ID__/${D1_DATABASE_ID}/g" wrangler.toml
          sed -i "s/__ADMIN_USERNAME__/${ADMIN_USERNAME}/g" wrangler.toml
          sed -i "s/__ADMIN_PASSWORD__/${ADMIN_PASSWORD}/g" wrangler.toml
          sed -i "s/__JWT_SECRET__/${JWT_SECRET}/g" wrangler.toml
          npx wrangler deploy --config wrangler.toml

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: worker
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/worker.js
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
